<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../public/img/introduction/icon.png">
  <title>Scope Tour - User Profile</title>

  <link href="../public/css/main.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../public/css/main-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../public/css/list-goal-team.css">
  <link rel="stylesheet" href="../public/css/user-profile.css">

  <script type="text/javascript" src="../js/list-goal-team-sidebar.js" defer></script>
</head>
<body>
  <custom-sidebar data-active-menu="user-profile"></custom-sidebar>

  <main>
    <div id="header">
      <div class="header-user">
        <div class="user-avatar">
          <i class="fa-solid fa-circle-user"></i>
        </div>
        <div class="user-name">
          <h3 class="my-0" id="user_name">User</h3>
        </div>
        <div class="user-streak">
          <img src="../public/img/list-team-goal/slider2.png" alt="streak" class="icon-streak">
          <div class="number-streak">
            <span>30</span>
          </div>
        </div>
      </div>

      <div class="header-time">
        <h4 class="time my-0">09:41</h4>
      </div>
    </div>

    <section class="profile-page">
      <div class="profile-card profile-main">
        <div class="profile-avatar-block">
          <label for="profile-image-input" class="avatar-wrapper">
            <img id="profile-image-preview" src="../public/img/introduction/icon.png" alt="Profile avatar">
            <span class="avatar-edit-badge">
              <i class="fa-solid fa-camera"></i>
            </span>
          </label>
          <input id="profile-image-input" type="file" accept="image/*">
          <h4 id="profile-display-name">User</h4>
          <p id="profile-display-email">user@email.com</p>
        </div>

        <form class="profile-form" id="profile-form" novalidate>
          <div class="field-row">
            <label for="profile-name">Full name</label>
            <input id="profile-name" type="text" placeholder="Enter your full name">
          </div>

          <div class="field-row">
            <label for="profile-email">Email</label>
            <input id="profile-email" type="email" placeholder="Enter your email">
          </div>

          <div class="field-row">
            <label for="profile-phone">Phone</label>
            <input id="profile-phone" type="tel" placeholder="Enter your phone number">
          </div>

          <div class="field-row">
            <label for="profile-bio">Bio</label>
            <textarea id="profile-bio" rows="4" placeholder="Tell your teammates about yourself"></textarea>
          </div>

          <div class="profile-actions">
            <button type="button" class="btn btn-secondary" id="reset-profile-btn">Reset</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>

      <div class="profile-card profile-stats">
        <h5>Overview</h5>
        <div class="stats-grid">
          <article>
            <span class="stat-label">Current streak</span>
            <strong>30 days</strong>
          </article>
          <article>
            <span class="stat-label">Teams joined</span>
            <strong>4 teams</strong>
          </article>
          <article>
            <span class="stat-label">Tasks completed</span>
            <strong>112 tasks</strong>
          </article>
          <article>
            <span class="stat-label">Subjects active</span>
            <strong>9 subjects</strong>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/component.js"></script>
  <script src="../public/config.js"></script>
  <script type="module" src="../public/activity/time.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const userNameEl = document.getElementById("user_name");
      const displayNameEl = document.getElementById("profile-display-name");
      const displayEmailEl = document.getElementById("profile-display-email");
      const nameInput = document.getElementById("profile-name");
      const emailInput = document.getElementById("profile-email");
      const imageInput = document.getElementById("profile-image-input");
      const imagePreview = document.getElementById("profile-image-preview");
      const resetButton = document.getElementById("reset-profile-btn");

      let originalData = {
        name: "",
        email: "",
        phone: "",
        bio: ""
      };

      try {
        const rawUser = localStorage.getItem("user");
        if (rawUser) {
          const user = JSON.parse(rawUser);
          const displayName = user.name || user.user_name || user.username || "User";
          const displayEmail = user.email || "user@email.com";

          originalData.name = displayName;
          originalData.email = displayEmail;

          userNameEl.textContent = displayName;
          displayNameEl.textContent = displayName;
          displayEmailEl.textContent = displayEmail;

          nameInput.value = displayName;
          emailInput.value = displayEmail;
        }
      } catch (error) {
        console.error("Failed to load user profile data:", error);
      }

      imageInput.addEventListener("change", function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          imagePreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      resetButton.addEventListener("click", function () {
        nameInput.value = originalData.name;
        emailInput.value = originalData.email;
        document.getElementById("profile-phone").value = originalData.phone;
        document.getElementById("profile-bio").value = originalData.bio;
      });

      document.getElementById("profile-form").addEventListener("submit", function (event) {
        event.preventDefault();
        alert("Profile changes have been saved successfully!");
      });
    });
  </script>
</body>
</html>
